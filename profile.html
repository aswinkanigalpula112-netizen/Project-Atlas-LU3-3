
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aswin | Project Atlas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .profile-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: bold;
            margin: 0 auto 18px;
        }

        h1 {
            font-size: 23px;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .role {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .intro {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        h2 {
            font-size: 17px;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            list-style: none;
        }

        .skills li {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .portfolio {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .portfolio:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <main>
        <article class="profile-card">

            <div class="avatar">KA</div>

            <h1>KANIGALPULA ASWIN</h1>

            <p class="role">Full Stack Developer</p>

            <p class="intro">
                I enjoy building software, solving problems,
                and learning new technologies.
            </p>

            <h2>My Skills</h2>

            <ul class="skills">
                <li>Python</li>
                <li>JavaScript</li>
                <li>Git</li>
            </ul>

            <a class="portfolio"
               href="https://github.com/aswinkanigalpula112-netizen"
               target="_blank"
               rel="noopener noreferrer">
                Visit My GitHub
            </a>

        </article>
    </main>

</body>
</html>
